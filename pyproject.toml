[project]
name = "etymo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aahrav", email = "aaravparmar2408@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=2.14.0",
    "flask>=3.0.0",
    "gensim>=4.3.0",
    "gutenbergpy>=0.3.5",
    "manim>=0.17.0",
    "matplotlib>=3.7.0",
    "nltk>=3.8.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "seaborn>=0.12.0",
    "torch>=2.14.1",
]

[project.scripts]
etymo = "etymo:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
